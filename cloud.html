<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ODC 勤怠シフト表</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf6f8;color:#3d343a;font-family:system-ui,'Yu Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:12px}h1{font-size:22px;margin:5px 0 15px}.sub{font-size:12px;color:#8b7882}.panel{background:white;border:1px solid #eadce3;border-radius:14px;padding:13px;margin:12px 0}button,input,select{font:inherit}button{background:white;border:1px solid #d9c4cf;border-radius:8px;padding:8px 10px;cursor:pointer;color:#553e4b}button:hover{background:#f6eaf0}.primary{background:#a76d87;color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}.grid{display:grid;grid-template-columns:minmax(46px,1fr) repeat(6,minmax(39px,1fr));border-top:1px solid #eadfe4;border-left:1px solid #eadfe4}.cell{border-right:1px solid #eadfe4;border-bottom:1px solid #eadfe4;min-height:35px;display:flex;align-items:center;justify-content:center;font-size:12px}.head{background:#f8eff3;font-weight:700;min-height:43px;word-break:break-all;text-align:center}.day{background:#fdf9fb}.sun{color:#c35d68}.sat{color:#487eb0}.shift{border:0;border-radius:0;width:100%;height:35px;padding:0;font-weight:bold}.early{color:#397ca6}.late{color:#c17e26}.off{background:#dedfe2;color:#a2a5aa;font-size:19px;font-weight:400}.leave{background:#f5e7c8;color:#9c762d}.unset{background:repeating-linear-gradient(135deg,#fff,#fff 5px,#f8f6f7 5px,#f8f6f7 10px);color:#aaa}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.fields input{padding:8px;border:1px solid #dacbd3;border-radius:7px;width:100%}.pattern{border:1px solid #eee1e8;border-radius:10px;padding:10px;margin:9px 0}.hidden{display:none}.warning{background:#fff5e6;border:1px solid #efd6b1;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}dialog{border:1px solid #e1cbd5;border-radius:14px;width:min(90vw,380px);padding:20px}dialog::backdrop{background:#32242b77}.phone-option{display:flex;gap:8px;align-items:center;margin:0 0 18px;font-size:14px}.phone-option input{width:18px;height:18px}.phone-mark{color:#95516f;margin-left:3px;font-size:12px}dialog select{padding:10px;width:100%;margin:8px 0 18px}footer{font-size:11px;color:#8b7882;margin:20px 0}@media(max-width:420px){main{padding:7px}.panel{padding:7px}.grid{grid-template-columns:minmax(43px,1fr) repeat(6,minmax(39px,1fr))}.head{font-size:11px}}
</style><main><div class="sub">OMOTESANDO DENTAL CLINIC</div><h1>勤怠管理・シフト表</h1><section class="panel" id="authPanel"><h2>ログイン</h2><p id="authNote">スタッフIDとパスワードを入力してください。</p><form id="loginForm"><div class="fields"><label>スタッフID<input id="loginId" autocomplete="username" required></label><label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label></div><p><button class="primary" id="loginButton">ログイン</button></p></form></section><p id="status" role="status" aria-live="polite"></p><div id="workspace" hidden><div class="row"><span id="roleLabel"></span><div><button id="reloadCloud">最新を読み込む</button> <button id="logout">ログアウト</button></div></div><div class="warning">共有シフト版：出退勤打刻・勤怠集計・院内Wi-Fi制限は次の開発工程です。</div><section class="panel"><div class="row"><div><button id="prev">‹</button> <b id="month"></b> <button id="next">›</button> <button id="today">今月</button></div><div><button id="export">CSV出力</button><button id="backup">バックアップ</button></div></div><p class="sub">セルをタップしてシフトを変更。無印＝普通、早＝早番、遅＝遅番、灰色の休＝休日、有＝有給、・＝未登録、電＝電話番（普通・早番・遅番と併用可）。</p><div class="grid" id="grid"></div></section><section class="panel"><div class="row"><h2 style="font-size:17px">スタッフ・シフト設定</h2><button id="toggle">設定を開く</button></div><div id="settings" class="hidden"><h3>スタッフ6人</h3><div class="fields" id="staffFields"></div><h3>シフトパターン</h3><div id="patterns"></div><button class="primary" id="save">設定を保存</button></div></section><footer>普通 09:30–18:30 / 早番 09:00–18:00 / 遅番 10:00–19:00 / 休憩各60分（初期値）</footer></div></main><dialog id="dialog"><form method="dialog" id="form"><h3 id="dialogTitle">シフト変更</h3><select id="type"><option value="normal">普通（無印）</option><option value="early">早番</option><option value="late">遅番</option><option value="off">休日</option><option value="leave">有給</option><option value="unset">未登録</option></select><label class="phone-option"><input id="phone" type="checkbox">電話番（電）</label><div class="row"><button value="cancel">キャンセル</button><button class="primary" value="save">保存</button></div></form></dialog><script src="cloud-config.js"></script><script src="cloud.js"></script><script>
(()=>{const base={staff:['スタッフA','スタッフB','スタッフC','スタッフD','スタッフE','スタッフF'],patterns:{early:['09:00','18:00',60],normal:['09:30','18:30',60],late:['10:00','19:00',60]},shifts:{},phones:{}};let data=structuredClone(base),busy=false;let now=new Date(),y=now.getFullYear(),m=now.getMonth(),selected='';const $=id=>document.getElementById(id),save=async()=>{await ODCCloud.save(data)},pad=n=>String(n).padStart(2,'0'),key=d=>`${y}-${pad(m+1)}-${pad(d)}`,escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),names={normal:'',early:'早',late:'遅',off:'休',leave:'有',unset:'·'};function render(){ $('month').textContent=`${y}年${m+1}月`;const grid=$('grid');grid.replaceChildren();function cell(t,cl){const e=document.createElement('div');e.className='cell '+cl;e.textContent=t;grid.append(e);return e}cell('日付','head');data.staff.forEach(n=>cell(n,'head'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const w=new Date(y,m,d).getDay();cell(`${d} ${'日月火水木金土'[w]}`,'day '+(w===0?'sun':w===6?'sat':''));for(let i=0;i<6;i++){const id=key(d)+'_'+i,type=data.shifts[id]||'unset',wrap=cell('','');const b=document.createElement('button');b.className='shift '+type;b.textContent=names[type]??'·';if(data.phones[id]){const mark=document.createElement('span');mark.className='phone-mark';mark.textContent='電';b.append(mark)}b.setAttribute('aria-label',`${key(d)} ${data.staff[i]} ${{normal:'普通',early:'早番',late:'遅番',off:'休日',leave:'有給',unset:'未登録'}[type]}${data.phones[id]?' 電話番':''}`);b.disabled=!ODCCloud.isAdmin()||busy;b.onclick=()=>{selected=id;$('dialogTitle').textContent=`${m+1}月${d}日・${data.staff[i]}`;$('type').value=type;$('phone').checked=!!data.phones[id];$('dialog').showModal()};wrap.append(b)}}}function settings(){ $('staffFields').innerHTML=data.staff.map((s,i)=>`<label>スタッフ${i+1}<input id="s${i}" maxlength="20" value="${escape(s)}"></label>`).join('');$('patterns').innerHTML=['early','normal','late'].map(k=>`<div class="pattern"><b>${{early:'早番',normal:'普通（無印）',late:'遅番'}[k]}</b><div class="fields"><label>開始<input id="${k}0" type="time" value="${escape(data.patterns[k][0])}"></label><label>終了<input id="${k}1" type="time" value="${escape(data.patterns[k][1])}"></label><label>休憩（分）<input id="${k}2" type="number" min="0" max="480" value="${escape(data.patterns[k][2])}"></label></div></div>`).join('')}function download(name,content,mime){const url=URL.createObjectURL(new Blob(['\ufeff',content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}const csv=a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',');$('prev').onclick=()=>{if(--m<0){m=11;y--}render()};$('next').onclick=()=>{if(++m>11){m=0;y++}render()};$('today').onclick=()=>{const d=new Date();y=d.getFullYear();m=d.getMonth();render()};$('form').onsubmit=async e=>{if(e.submitter?.value!=='save')return;e.preventDefault();if(busy)return;const previous=structuredClone(data);const t=$('type').value;if(t==='unset')delete data.shifts[selected];else data.shifts[selected]=t;if($('phone').checked&&['normal','early','late'].includes(t))data.phones[selected]=true;else delete data.phones[selected];busy=true;render();e.submitter.disabled=true;try{await save();$('dialog').close();$('status').textContent='共有データに保存しました。'}catch(error){data=previous;$('status').textContent=error.message;$('dialog').close()}finally{busy=false;e.submitter.disabled=false;render()}};$('toggle').onclick=()=>{$('settings').classList.toggle('hidden');$('toggle').textContent=$('settings').classList.contains('hidden')?'設定を開く':'設定を閉じる'};$('save').onclick=async()=>{if(busy)return;const staff=Array.from({length:6},(_,i)=>$('s'+i).value.trim());if(staff.some(x=>!x)){alert('スタッフ名を入力してください');return}const patterns={};for(const k of ['early','normal','late']){const a=[$(k+'0').value,$(k+'1').value,Number($(k+'2').value)];if(!a[0]||!a[1]||a[0]>=a[1]||!Number.isFinite(a[2])||a[2]<0||a[2]>480){alert('勤務時間と休憩を確認してください');return}patterns[k]=a}const previous=structuredClone(data);data.staff=staff;data.patterns=patterns;busy=true;$('save').disabled=true;render();try{await save();$('status').textContent='設定を共有保存しました。'}catch(error){data=previous;settings();$('status').textContent=error.message}finally{busy=false;$('save').disabled=false;render()}};$('export').onclick=()=>{const rows=[['日付','曜日',...data.staff]];for(let d=1;d<=new Date(y,m+1,0).getDate();d++)rows.push([key(d),'日月火水木金土'[new Date(y,m,d).getDay()],...data.staff.map((_,i)=>({normal:'普通',early:'早番',late:'遅番',off:'休日',leave:'有給',unset:'未登録'})[data.shifts[key(d)+'_'+i]||'unset']+(data.phones[key(d)+'_'+i]?'・電話番':''))]);download(`ODC_シフト_${y}_${pad(m+1)}.csv`,rows.map(csv).join('\r\n'),'text/csv;charset=utf-8')};$('backup').onclick=()=>download('ODC_シフト_バックアップ.json',JSON.stringify(data,null,2),'application/json');
function showWorkspace(){ $('workspace').hidden=false;$('authPanel').hidden=true;$('roleLabel').textContent=ODCCloud.isAdmin()?'管理者：シフト編集可能':'スタッフ：閲覧';$('toggle').hidden=!ODCCloud.isAdmin();$('settings').classList.add('hidden');$('toggle').textContent='設定を開く';settings();render() }
function lock(){data=structuredClone(base);$('workspace').hidden=true;$('authPanel').hidden=false;$('grid').replaceChildren();$('staffFields').replaceChildren();$('patterns').replaceChildren();$('dialog').close();$('loginPassword').value='';}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('loginButton').disabled=true;try{data=await ODCCloud.login($('loginId').value.trim(),$('loginPassword').value);busy=false;showWorkspace();$('status').textContent='共有データを読み込みました。'}catch(error){lock();$('status').textContent=error.message}finally{$('loginPassword').value='';busy=false;$('loginButton').disabled=!ODCCloud.configured()}};
$('reloadCloud').onclick=async()=>{if(busy)return;busy=true;render();try{data=await ODCCloud.load();settings();$('status').textContent='最新の共有データを読み込みました。'}catch(error){$('status').textContent=error.message}finally{busy=false;render()}};
$('logout').onclick=async()=>{if(busy)return;busy=true;try{await ODCCloud.logout();$('status').textContent='ログアウトしました。'}catch(error){$('status').textContent='この画面からログアウトしました。通信できず、サーバー側のセッション終了は未確認です。'}finally{lock();busy=false}};
if(!ODCCloud.configured()){$('authNote').textContent='ログイン・共有保存の準備版です。管理者による接続設定が必要です。';$('loginButton').disabled=true;}
})();
</script></html>
